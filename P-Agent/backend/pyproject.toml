[project]
name = "p-agent-backend"
version = "0.1.0"
description = "P-Agent Backend - GUI 기반 AI Agent (FastAPI + LangGraph + 자체 MCP 서버)"
readme = "../README.md"
requires-python = ">=3.11"

# ------------------------------------------------------------
# 런타임 의존성
#  - 폐쇄망 배포를 고려해 순수 Python 패키지 위주로 구성
#  - 무거운 로컬 모델(OmniParser/PaddleOCR/BGE-M3)은 STEP 7/10 에서
#    별도 optional 그룹으로 추가한다.
# ------------------------------------------------------------
dependencies = [
    # --- 웹 서버 ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # --- 설정 로딩 (.env 기반, 시스템 환경변수 비의존) ---
    "python-dotenv>=1.0",
    # --- HTTP 클라이언트 ---
    "httpx>=0.27",
    # --- LLM Provider SDK (Adapter 로 스위칭) ---
    "anthropic>=0.40",   # 개발용: Claude
    "openai>=1.55",      # 개발용: GPT / 배포용: P-GPT (OpenAI 호환)
    # --- Agent 그래프 ---
    "langgraph>=0.2.45",
    "langchain-core>=0.3",
    # --- 자체 MCP 서버/클라이언트 (STEP 3) ---
    "mcp>=1.1",
    # --- 문서 생성 (STEP 8) ---
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
