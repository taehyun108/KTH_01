name: Summarize submitted URL

# 즐겨찾기 탭의 URL 입력창이 "[요약]" 제목의 이슈를 생성하면 실행된다.
# 저장소 소유자가 연 이슈만 처리(무단 요청으로 Gemini 쿼터 소진 방지).
on:
  issues:
    types: [opened]
  # 수동 검증용 — URL 을 직접 넣어 요약 경로를 점검할 수 있다
  workflow_dispatch:
    inputs:
      video_url:
        description: "요약할 유튜브 URL"
        required: true
        type: string

permissions:
  contents: write   # 새 리포트/인덱스를 main 에 커밋
  issues: write     # 결과를 이슈에 댓글로 남기고 닫기

jobs:
  summarize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, '[요약]') &&
       github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 25   # Gemini 영상 직접 분석은 몇 분 걸릴 수 있다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Summarize the submitted URL
        id: summarize
        env:
          GEMINI_API_KEY: ${{ secrets.KTH_01_GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          VIDEO_URL: ${{ inputs.video_url }}
        run: python scripts/summarize_url.py

      # 새로 만든 리포트에 옛 기관·기업 명칭이 없는지 확인
      - name: Organization name check
        id: check_names
        if: always()
        run: PYTHONPATH=scripts python scripts/check_names.py

      # 어미가 한쪽으로 쏠려 딱딱하게 읽히지는 않는지 확인
      - name: Tone check (어미 쏠림)
        if: always()
        run: PYTHONPATH=scripts python scripts/check_tone.py

      # archive.yml 과 같은 원칙 — 명칭 검사는 always() 로 '항상 확인'은 하되,
      # 그 실패가 이 커밋까지 막지는 않는다. 안 그러면 이 파일과 무관한, 사이트
      # 어딘가에 남아 있는 <기존> 옛 명칭 하나가 모든 새 URL 등록을 계속 막는다
      # (2026-09-17 에 실제로 이렇게 막혔다 — 9월 9일자 다른 리포트의 옛 명칭
      # 때문에, 오늘 만든 리포트는 아무 문제가 없는데도 커밋이 skip 됐다).
      - name: Commit new report
        id: commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain site/)" ]; then
            git add site/
            git commit -m "chore: add on-demand report (${{ github.event_name == 'issues' && format('issue #{0}', github.event.issue.number) || 'manual' }})"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "변경 사항 없음"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment result and close issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const status = `${{ steps.summarize.outputs.status }}`;
            const message = `${{ steps.summarize.outputs.message }}`;
            const reportUrl = `${{ steps.summarize.outputs.report_url }}`;
            const committed = `${{ steps.commit.outputs.committed }}` === 'true';
            const site = 'https://taehyun108.github.io/KTH_01';
            // summarize 가 'ok' 라고 해도 실제로 커밋이 안 됐으면 성공이 아니다.
            // 예전에는 이 확인이 없어서, 커밋이 skip 되거나 push 가 밀려도
            // "✅ 요약 완료"만 보고 링크를 걸었다 — 그 링크는 존재하지 않았다.
            // status='ok' 는 '이번에 새로 만들었다'는 뜻이라 실제 커밋 여부를 봐야 한다.
            // status='exists' 는 '예전에 이미 커밋된 리포트를 가리킨다'는 뜻이라
            // 이번 실행의 committed 와는 무관하다 — 여기까지 묶으면 이미 존재하는
            // 정상 리포트의 링크까지 안내에서 빠지는 회귀가 생긴다.
            const newButNotCommitted = status === 'ok' && !committed;
            const icon = newButNotCommitted ? '⚠️'
              : { ok: '✅', exists: 'ℹ️', quota: '⏳', error: '⚠️' }[status] || '⚠️';
            let body;
            if (newButNotCommitted) {
              const nameCheck = `${{ steps.check_names.outcome }}`;
              body = `⚠️ 리포트는 만들어졌지만 저장소에 반영되지 못했습니다. `
                   + `(명칭 검사: ${nameCheck}) Actions 로그를 확인해 주세요.`;
            } else {
              body = `${icon} ${message || '처리 결과를 확인할 수 없습니다.'}`;
            }
            if (!newButNotCommitted && reportUrl) {
              body += `\n\n🔗 리포트: ${site}/${reportUrl}`;
              body += `\n(배포까지 1~2분 걸릴 수 있습니다.)`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
            });
