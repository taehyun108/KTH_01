name: Verify config (no API cost)

# 설정이 멀쩡한지 바로 확인하기 위한 워크플로.
# Gemini 를 호출하지 않으므로 하루 쿼터를 전혀 쓰지 않는다.
# 채널을 추가했을 때처럼 "지금 당장 맞는지 보고 싶다" 할 때 손으로 돌린다.
#
#   Actions 탭 → Verify config → Run workflow
on:
  workflow_dispatch:
  # 설정·스크립트를 건드린 커밋에서는 자동으로 한 번 확인한다
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Keyword, shorts and name tests
        run: PYTHONPATH=scripts python scripts/test_keywords.py

      # 채널 id 오타는 오류가 아니라 '조용한 0건'으로 나타난다. 여기서 잡는다.
      - name: Channel health check
        run: PYTHONPATH=scripts python scripts/check_channels.py

      # 용어집 카드에 적은 '그림 N · 표 N' 이 실제 내용과 맞는지.
      # 손으로 관리하면 반드시 어긋나고, 틀린 숫자는 없느니만 못하다.
      - name: Glossary badge check
        if: always()
        run: PYTHONPATH=scripts python scripts/sync_glossary_badges.py

      - name: Organization name check
        if: always()
        run: PYTHONPATH=scripts python scripts/check_names.py

      - name: Tone check
        if: always()
        run: PYTHONPATH=scripts python scripts/check_tone.py

      - name: Transcript cache status
        if: always()
        run: |
          PYTHONPATH=scripts python -c "
          import transcript_cache as tc
          n, chars = tc.stats()
          print(f'자막 캐시 — {n}건 · 약 {chars:,}자')
          print('집 PC 에서 tools/run-transcripts.bat 을 돌리면 이 숫자가 올라갑니다.'
                if n == 0 else '캐시가 있습니다. 파이프라인이 이것을 먼저 씁니다.')
          "
