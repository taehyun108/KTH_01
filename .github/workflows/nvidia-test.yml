name: Test NVIDIA key

# 등록한 NVIDIA 키가 실제로 호출되는지 가볍게 확인한다. 리포트 전체 경로를
# 돌리지 않고 nvidia_models.generate() 하나만 불러 확인한다.
# (이 경로는 텍스트 처리의 2순위 예비이므로, 실제로 한 번도 안 불려 보고
#  며칠 뒤 발행이 막혀서야 키 오타를 아는 것보다 지금 바로 확인하는 편이 낫다)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Call NVIDIA once
        env:
          PYTHONUNBUFFERED: "1"
          NVIDIA_API_KEY: ${{ secrets.KTH_01_NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.KTH_01_NVIDIA_API_KEY_2 }}
          NVIDIA_API_KEY_3: ${{ secrets.KTH_01_NVIDIA_API_KEY_3 }}
        run: |
          PYTHONPATH=scripts python -c "
          import nvidia_models as nm
          print(f'등록된 키: {nm.key_count()}개')
          if nm.key_count() == 0:
              raise SystemExit('KTH_01_NVIDIA_API_KEY 시크릿이 비어 있습니다.')
          print(f'먼저 지금 기본 모델({nm.DEFAULT_MODEL})부터 시도합니다.')
          try:
              text = nm.generate('다음 JSON 만 그대로 출력하라: {\"ok\": 1}')
              print('응답:', text)
              assert '1' in text, '응답에 예상한 값이 없습니다'
              print(f'성공 — {nm.DEFAULT_MODEL} 가 정상 작동합니다.')
          except Exception as exc:
              print(f'기본 모델 실패 — {exc}')
              # 카탈로그 목록에 있다고 이 계정에서 실제 호출 가능하다는 뜻은
              # 아니다('Function ... Not found for account' 404 로만 드러난다).
              # 하나씩 추측해 왕복하는 대신 후보들을 자동으로 순서대로 호출해
              # 처음 성공하는 것을 찾는다.
              print('후보 모델을 순서대로 시도합니다...')
              found, tried = nm.probe_working_model()
              for m, reason in tried:
                  print(f'  실패: {m} — {reason}')
              if found:
                  print(f'성공 — {found} 가 정상 작동합니다.')
                  print(f'::notice::nvidia_models.py 의 DEFAULT_MODEL 을 {found!r} 로 바꾸세요')
              else:
                  print('모든 후보가 실패했습니다.')
                  raise SystemExit(1)
          "
