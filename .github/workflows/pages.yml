name: Deploy to GitHub Pages

# main 에 push 되거나, site/ 를 커밋하는 워크플로가 끝나면 site/ 를 Pages 로 배포.
# ※ 중요: GITHUB_TOKEN(봇) 커밋은 push 트리거를 못 걸므로, site/ 를 커밋하는 워크플로는
#   반드시 아래 workflow_run.workflows 목록에 추가해야 배포가 된다.
#   (누락하면 리포트는 커밋되지만 사이트에 안 보이는 문제가 발생함)
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Build report archive", "Summarize submitted URL", "Delete report"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 1건만 유지
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
