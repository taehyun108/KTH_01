name: Deploy to GitHub Pages

# main 에 push 되거나, site/ 를 커밋하는 워크플로가 끝나면 site/ 를 Pages 로 배포.
# ※ 중요: GITHUB_TOKEN(봇) 커밋은 push 트리거를 못 걸므로, site/ 를 커밋하는 워크플로는
#   반드시 아래 workflow_run.workflows 목록에 추가해야 배포가 된다.
#   (누락하면 리포트는 커밋되지만 사이트에 안 보이는 문제가 발생함)
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Build report archive", "Summarize submitted URL", "Delete report"]
    types: [completed]
  workflow_dispatch:
  # 배포가 실패하면 다음 커밋이 있을 때까지 사이트가 옛 내용에 머문다.
  # 하루 한 번(06:40 KST) 자동으로 다시 배포해 그 상태가 오래가지 않게 한다.
  schedule:
    - cron: "40 21 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 1건만 유지
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub Pages 쪽이 붐비면 기본 대기(10분) 안에 안 끝나 'Timeout reached' 로 실패한다.
      # (2026-08-06 21시 실행이 이 사유로 실패해 사이트가 138건에서 멈췄다)
      # 대기 시간을 넉넉히 주고, 그래도 실패하면 한 번 더 시도한다.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000        # 20분 (기본 10분)

      - name: Deploy (재시도)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
