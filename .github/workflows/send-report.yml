name: Send report to Telegram

# 사이트 카드의 📨 버튼이 "[전송] <리포트 id>" 이슈를 열면, 그 리포트의 전문
# (01 핵심 개요 ~ 08 용어 사전)과 유튜브 링크를 텔레그램으로 보낸다.
#
# 실제 권한은 여기서 지켜진다 — 저장소 소유자가 연 이슈만 처리한다.
# (사이트는 공개라 누구나 이슈를 열 수 있지만, 남의 이슈는 이 조건에서 걸린다)
on:
  issues:
    types: [opened]
  # 수동 검증용 — 리포트 id 를 직접 넣어 전송 경로를 점검할 수 있다
  workflow_dispatch:
    inputs:
      report_id:
        description: "보낼 리포트 id (reports.json 의 id)"
        required: true
        type: string

permissions:
  contents: read
  issues: write     # 결과를 이슈에 댓글로 남기고 닫기

jobs:
  send:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, '[전송]') &&
       github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Send the report
        id: send
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPORT_ID: ${{ inputs.report_id }}
        run: PYTHONPATH=scripts python scripts/send_report.py

      - name: Comment result and close issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const status = `${{ steps.send.outputs.status }}`;
            const message = `${{ steps.send.outputs.message }}`;
            const icon = { ok: '📨', notfound: 'ℹ️', error: '⚠️' }[status] || '⚠️';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${icon} ${message || '처리 결과를 확인할 수 없습니다. Actions 로그를 확인해 주세요.'}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
            });
