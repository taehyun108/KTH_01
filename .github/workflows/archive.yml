name: Build report archive

# 하루 2회(약 09:00, 21:00 KST) 실행 + 수동 실행
#
# ※ 왜 정각이 아니라 23:43 / 11:43 인가
#   예전에는 00:00 / 12:00 UTC(정각)로 걸어 뒀는데, 실제 시작이 매번
#   53~149분씩 밀렸다(2026-08-04~09 12회 연속, 평균 100분).
#   '정각 0분'은 전 세계 예약이 몰리는 시간이라 GitHub 대기열에서 밀린다.
#   붐비지 않는 분(:43)으로 옮겨 예정 시각에 가깝게 돌도록 한다.
#   예약이 여전히 조금 밀릴 수 있으므로 목표 시각보다 17분 앞서 건다.
#
# ※ 주의 — cron 을 고칠 때는 '대기 중인 실행이 없는지' 먼저 보라.
#   GitHub 는 예약을 이 파일에서 그때그때 읽는다. 실행이 밀려 대기열에 있는
#   동안 해당 cron 줄을 지우면 그 실행이 함께 사라진다.
#   2026-08-10 에 이렇게 아침 실행 한 번을 통째로 날렸다.
#   최근 실행 시각은 Actions 탭에서 확인할 수 있다.
# ※ 왜 하루 두 번이 아니라 네 번인가
#   GitHub 는 예약(schedule)을 <보장하지 않는다>. 부하가 몰리면 밀리는 정도가 아니라
#   그냥 건너뛴다. 2026-08-12 아침(23:43Z 예정)이 실제로 그렇게 통째로 사라졌다
#   — 대기열에도 없고 실행 기록도 없었다.
#   두 번만 걸어 두면 한 번 걸렀을 때 반나절이 비지만, 네 번이면 그 사이를 메운다.
#   파이프라인은 이미 처리한 영상을 다시 만들지 않으므로(seen_store) 더 돌아도
#   손해가 없고, 쿼터는 어차피 하루 한도가 알아서 막는다.
on:
  schedule:
    - cron: "43 23 * * *"   # → 08:43 KST 예정 (아침 본편)
    - cron: "17 02 * * *"   # → 11:17 KST 예정 (아침이 걸렀을 때 받쳐 줌)
    - cron: "43 11 * * *"   # → 20:43 KST 예정 (저녁 본편)
    - cron: "17 14 * * *"   # → 23:17 KST 예정 (저녁이 걸렀을 때 받쳐 줌)
  workflow_dispatch:
    inputs:
      since:
        description: "백필 시작일(YYYY-MM-DD). 비우면 최신 RSS만 수집."
        required: false
        default: ""

permissions:
  contents: write   # 새 리포트/인덱스를 main 에 커밋
  # GitHub Models 예비 추론 경로. 이 한 줄이 있어야 GITHUB_TOKEN 이 추론 권한을 얻는다.
  # 별도 API 키가 필요 없다 — Actions 가 넣어 주는 토큰을 그대로 쓴다.
  # Gemini 무료 한도가 바닥났을 때만(모델에 따라 하루 20건) 여기로 넘어간다.
  models: read

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub 기본 한도는 6시간이다. 거기까지 가면 job 이 '취소'되면서
    # 커밋 단계가 건너뛰어져 그때까지 만든 리포트를 통째로 잃는다.
    # 정상 실행은 3~15분이므로 넉넉히 잡되 한참 앞에서 끊는다.
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"   # 로그가 버퍼링돼 순서가 뒤섞이면 원인 추적이 어려워짐
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 키워드를 손댄 뒤 '국내 정책이 통째로 누락'되거나 '무관한 영상이 쏟아지는'
      # 회귀를 즉시 잡는다. 쇼츠 판정도 함께 검사한다.
      # LLM·네트워크를 쓰지 않아 몇 초면 끝난다.
      - name: Keyword and shorts regression test
        run: PYTHONPATH=scripts python scripts/test_keywords.py

      # 채널 id 는 사람이 못 읽는 24자라, 한 글자만 틀려도 오류 없이 '조용히 0건'이
      # 된다. 몇 주 뒤에야 알아채는 일이 없도록 매 실행 확인한다.
      # 실패시키지는 않는다 — 유튜브가 일시적으로 5xx 를 주는 일이 있어서,
      # 그것 때문에 수집 자체를 멈추면 손해가 더 크다.
      - name: Channel health check
        run: PYTHONPATH=scripts python scripts/check_channels.py --warn

      # ※ 순서 중요: '최신 영상 수집'이 먼저 쿼터를 쓰고, 남은 쿼터로 옛 리포트를 재생성한다.
      #   (반대로 하면 재생성이 일일 쿼터를 다 써버려 최신 영상이 계속 밀린다)
      - name: Run pipeline (RSS → 키워드 필터 → Gemini 요약 → HTML → 인덱스)
        env:
          GEMINI_API_KEY: ${{ secrets.KTH_01_GEMINI_API_KEY }}
          # Gemini 한도 소진 시 예비 추론 경로(GitHub Models). 별도 키 없이 쓰는 토큰.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 설명글·영상 길이를 공식 API 로 가져옵니다(무료 10,000유닛/일, 후보 200건에 4유닛).
          # 없으면 그냥 건너뜁니다 — 지금까지와 똑같이 동작합니다.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BACKFILL_SINCE: ${{ github.event.inputs.since }}
          # ※ VIDEO_ANALYSIS_MAX 를 여기서 <고정하지 않는다>.
          #   예전에는 "5" 가 박혀 있었다. 그래서 코드 기본값을 15 로 올렸을 때
          #   이 줄이 조용히 덮어써, 바꾼 줄 알았던 값이 실제로는 5 그대로였다
          #   (2026-08-18 실행에서 '실행당 상한 5건'으로 찍혀 발각).
          #   설정값이 두 군데 있으면 반드시 한쪽이 잊힌다. 기본값은 코드에만 둔다.
          #   진짜 한도는 video_budget 이 <분> 단위로 하루치를 이어 세며 지킨다.
          VIDEO_MINUTES_PER_DAY: "420"
          # 러너 한도에 닿기 전에 스스로 마무리하도록 하는 처리 시간 상한(분)
          PIPELINE_BUDGET_MIN: "35"
        run: python scripts/run_pipeline.py

      # 남은 쿼터로 옛 말투 리포트를 현재 말투(PROMPT_VERSION)로 교체 — 며칠에 걸쳐 점진 완료
      #
      # ※ 상한을 사람이 손으로 맞추지 않는다.
      #   앞 단계가 남긴 .pipeline_state.json 을 보고 스스로 정한다.
      #     · 신규 발행이 쿼터·시간에 막혀 후보가 남았다 → 이 단계는 통째로 건너뛴다
      #     · 신규 발행이 후보를 다 처리했다(0건인 날 포함) → 남는 쿼터로 최대 N건
      #   예전에는 신규를 지키려고 REGEN_MAX=0 으로 막아 뒀는데, 정작 신규 후보가
      #   0건인 날에는 하루 쿼터가 통째로 놀았다(2026-08-10 실행에서 확인).
      - name: Regenerate old reports with the new tone (leftover quota)
        env:
          GEMINI_API_KEY: ${{ secrets.KTH_01_GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 신규 발행이 후보를 다 처리한 날에만 쓰는 상한
          REGEN_MAX_IDLE: "12"
        run: python scripts/regenerate.py

      # 앞 단계가 실패하더라도 이미 생성된 리포트는 저장한다 (작업 유실 방지)
      # 발행물 전체에 옛 기관·기업 명칭이 남아 있는지 확인한다.
      # 명칭 오류는 신뢰를 크게 깎으므로, 생성 프롬프트 주의와 별개로 기계 검사를 둔다.
      # 이번 실행에서 새로 만든 리포트까지 포함해 검사하도록 커밋 직전에 실행한다.
      - name: Organization name check
        if: always()
        run: PYTHONPATH=scripts python scripts/check_names.py

      # 커밋 <직전> 마지막 관문 — 결과물에 쇼츠가 섞였는지 길이로 확인하고 치운다.
      #   앞의 세 겹(열거·병합·enrich)은 전부 <후보 단계> 장치라, 하나라도 새면
      #   그대로 발행된다. 2026-08-20 에 실제로 10건이 새어 나가 있었고,
      #   사람이 눈으로 보고 알려 줄 때까지 한 달 넘게 남아 있었다.
      #
      #   ※ 실패시키지 않고 <스스로 치운다>. 아래 커밋 단계가 if: always() 라
      #     여기서 실패만 시켜서는 그 커밋을 못 막고, 막으려고 커밋 조건을
      #     손대면 다른 이유로 실패한 실행이 만든 멀쩡한 리포트까지 버려진다.
      - name: Shorts check (발행물 · 찾으면 제거)
        if: always()
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: PYTHONPATH=scripts python scripts/check_published.py --fix

      # 말투가 한쪽 어미로 쏠렸는지(=딱딱하게 읽히는지) 기계적으로 확인한다.
      # 이번 말투 버전으로 만들어진 리포트만 본다(옛 버전은 재생성 대기 중이라 제외).
      - name: Tone check (어미 쏠림)
        if: always()
        run: PYTHONPATH=scripts python scripts/check_tone.py

      # ※ push 전에 반드시 원격을 받아 붙인다.
      #   2026-08-11 아침 실행이 정확히 이것 때문에 통째로 날아갔다.
      #     [main 42cdbc6] chore: update battery report archive
      #      1 file changed, 25 insertions(+)
      #      ! [rejected]  main -> main (fetch first)
      #   실행 도중 사람이 main 에 커밋하면 러너 클론이 뒤처지고, 그대로 push 하면
      #   거부당하면서 그 실행이 만든 리포트가 전부 버려진다.
      #   커밋까지 다 해 놓고 마지막 한 줄에서 잃는 것이라 손해가 크다.
      - name: Commit new reports
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain site/)" ]; then
            echo "변경 사항 없음"
            exit 0
          fi
          git add site/
          git commit -m "chore: update battery report archive"

          # 원격이 앞서 있으면 받아 붙인 뒤 다시 시도한다.
          # 우리 커밋은 site/ 안의 서로 다른 파일이라 충돌이 사실상 없다.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 완료 (시도 $i)"
              exit 0
            fi
            echo "push 거부됨 — 원격을 받아 붙인 뒤 다시 시도합니다 ($i/5)"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::원격 변경과 충돌해 자동으로 합치지 못했습니다"
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "::error::5회 시도했지만 push 하지 못했습니다"
          exit 1
      # main 에 커밋이 push 되면 pages.yml 이 자동으로 재배포합니다.
      # (archive.yml 은 push 로 트리거되지 않으므로 [skip ci] 불필요)
