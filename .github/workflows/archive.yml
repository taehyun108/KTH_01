name: Build report archive

# 하루 2회(09:00, 21:00 KST = 00:00, 12:00 UTC) 실행 + 수동 실행
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "백필 시작일(YYYY-MM-DD). 비우면 최신 RSS만 수집."
        required: false
        default: ""

permissions:
  contents: write   # 새 리포트/인덱스를 main 에 커밋

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub 기본 한도는 6시간이다. 거기까지 가면 job 이 '취소'되면서
    # 커밋 단계가 건너뛰어져 그때까지 만든 리포트를 통째로 잃는다.
    # 정상 실행은 3~15분이므로 넉넉히 잡되 한참 앞에서 끊는다.
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"   # 로그가 버퍼링돼 순서가 뒤섞이면 원인 추적이 어려워짐
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 키워드를 손댄 뒤 '국내 정책이 통째로 누락'되거나 '무관한 영상이 쏟아지는'
      # 회귀를 즉시 잡는다. LLM·네트워크를 쓰지 않아 몇 초면 끝난다.
      - name: Keyword matching regression test
        run: PYTHONPATH=scripts python scripts/test_keywords.py

      # ※ 순서 중요: '최신 영상 수집'이 먼저 쿼터를 쓰고, 남은 쿼터로 옛 리포트를 재생성한다.
      #   (반대로 하면 재생성이 일일 쿼터를 다 써버려 최신 영상이 계속 밀린다)
      - name: Run pipeline (RSS → 키워드 필터 → Gemini 요약 → HTML → 인덱스)
        env:
          GEMINI_API_KEY: ${{ secrets.KTH_01_GEMINI_API_KEY }}
          BACKFILL_SINCE: ${{ github.event.inputs.since }}
          # 자막이 막힌 환경에서 Gemini 가 영상을 직접 보고 쓰는 리포트의 실행당 상한.
          # 무료 티어의 하루 영상 처리 한도(약 8시간)를 넘지 않도록 40분 × 5건으로 잡음.
          VIDEO_ANALYSIS_MAX: "5"
          # 러너 한도에 닿기 전에 스스로 마무리하도록 하는 처리 시간 상한(분)
          PIPELINE_BUDGET_MIN: "35"
        run: python scripts/run_pipeline.py

      # 남은 쿼터로 옛 말투(v1) 리포트를 새 말투(v2)로 교체 — 며칠에 걸쳐 점진 완료
      - name: Regenerate old reports with the new tone (leftover quota)
        env:
          GEMINI_API_KEY: ${{ secrets.KTH_01_GEMINI_API_KEY }}
          REGEN_MAX: "8"   # 최신 수집 몫을 남기기 위해 1회 실행당 상한
        run: python scripts/regenerate.py

      # 앞 단계가 실패하더라도 이미 생성된 리포트는 저장한다 (작업 유실 방지)
      - name: Commit new reports
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain site/)" ]; then
            git add site/
            git commit -m "chore: update battery report archive"
            git push
          else
            echo "변경 사항 없음"
          fi
      # main 에 커밋이 push 되면 pages.yml 이 자동으로 재배포합니다.
      # (archive.yml 은 push 로 트리거되지 않으므로 [skip ci] 불필요)
